site_name: Teens & Social Media Use
site_url: https://teensandsocialmedia.netlify.app/
site_description: An educational module for teens, parents, & educators about adolescent social media use.
strict: false
copyright: "&copy; Albert Eksarevskiy & Selin Iskender 2026"
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
 
theme:
  name: material
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
 
  features:
    - navigation.instant      # faster page loads
    - navigation.tracking     # URL updates as you scroll
    - navigation.tabs         # tabs at top of nav bar
    - navigation.tabs.sticky  # tabs remain visible even when scrolling down
    - navigation.top          # back-to-top button
    - navigation.footer       # prev/next page footer nav
    - search.suggest          # search autocomplete
    - search.highlight        # highlight search terms
    - toc.follow              # highlight current section in TOC
    - header.autohide         # hides header on scroll down, and shows it on scroll up
 
  font:
    text: Roboto
    code: Roboto Mono
 
markdown_extensions:
  - admonition          # nice colored callout boxes (!!! note, !!! warning, etc)
  - footnotes           # proper footnote rendering
  - toc:
      permalink: true   # adds a clickable # link next to each heading
      toc_depth: 3
  - pymdownx.details    # collapsible sections
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - tables
  - md_in_html

